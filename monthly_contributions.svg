<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Ubuntu, Sans-Serif">
  <!-- Background -->
  <rect width="800" height="320" rx="10" fill="#0d1117"/>

  <!-- Title -->
  <text x="30" y="35" fill="#58a6ff" font-size="14" font-weight="600">📊 Monthly Contributions — Mar 2025 to Mar 2026</text>
  <text x="30" y="55" fill="#8b949e" font-size="11">1,326 total · 100% commits · avg ~110/month</text>

  <!-- Grid lines -->
  <line x1="30" y1="75"  x2="780" y2="75"  stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="110" x2="780" y2="110" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="145" x2="780" y2="145" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="180" x2="780" y2="180" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="215" x2="780" y2="215" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="250" x2="780" y2="250" stroke="#21262d" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="20" y="79"  fill="#8b949e" font-size="10" text-anchor="end">180</text>
  <text x="20" y="114" fill="#8b949e" font-size="10" text-anchor="end">140</text>
  <text x="20" y="149" fill="#8b949e" font-size="10" text-anchor="end">100</text>
  <text x="20" y="184" fill="#8b949e" font-size="10" text-anchor="end">60</text>
  <text x="20" y="219" fill="#8b949e" font-size="10" text-anchor="end">20</text>

  <!-- Avg line at ~110 (y=138) -->
  <line x1="30" y1="138" x2="780" y2="138" stroke="#388bfd" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <text x="784" y="141" fill="#388bfd" font-size="9" opacity="0.8">avg</text>

  <!-- Bars: scale 0-180 maps to y 250-75 => height range 175px -->
  <!-- Formula: bar_height = value/180*175, y = 250 - bar_height -->
  <!-- bar width ~42px, gap ~15px, start x=35 -->

  <!-- Mar 2025: 105 → h=102, y=148 -->
  <rect x="35"  y="148" width="42" height="102" rx="4" fill="#238636"/>
  <text x="56"  y="143" fill="#3fb950" font-size="10" text-anchor="middle">105</text>
  <text x="56"  y="268" fill="#8b949e" font-size="10" text-anchor="middle">Mar</text>
  <text x="56"  y="278" fill="#6e7681" font-size="9"  text-anchor="middle">'25</text>

  <!-- Apr: 118 → h=115, y=135 -->
  <rect x="92"  y="135" width="42" height="115" rx="4" fill="#238636"/>
  <text x="113" y="130" fill="#3fb950" font-size="10" text-anchor="middle">118</text>
  <text x="113" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Apr</text>

  <!-- May: 148 → h=144, y=106 -->
  <rect x="149" y="106" width="42" height="144" rx="4" fill="#2ea043"/>
  <text x="170" y="101" fill="#56d364" font-size="10" text-anchor="middle" font-weight="600">148</text>
  <text x="170" y="268" fill="#8b949e" font-size="10" text-anchor="middle">May</text>
  <!-- Peak label -->
  <text x="170" y="88" fill="#56d364" font-size="9" text-anchor="middle">🔥 peak</text>

  <!-- Jun: 135 → h=131, y=119 -->
  <rect x="206" y="119" width="42" height="131" rx="4" fill="#238636"/>
  <text x="227" y="114" fill="#3fb950" font-size="10" text-anchor="middle">135</text>
  <text x="227" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Jun</text>

  <!-- Jul: 142 → h=138, y=112 -->
  <rect x="263" y="112" width="42" height="138" rx="4" fill="#238636"/>
  <text x="284" y="107" fill="#3fb950" font-size="10" text-anchor="middle">142</text>
  <text x="284" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Jul</text>

  <!-- Aug: 138 → h=134, y=116 -->
  <rect x="320" y="116" width="42" height="134" rx="4" fill="#238636"/>
  <text x="341" y="111" fill="#3fb950" font-size="10" text-anchor="middle">138</text>
  <text x="341" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Aug</text>

  <!-- Sep: 125 → h=121, y=129 -->
  <rect x="377" y="129" width="42" height="121" rx="4" fill="#238636"/>
  <text x="398" y="124" fill="#3fb950" font-size="10" text-anchor="middle">125</text>
  <text x="398" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Sep</text>

  <!-- Oct: 118 → h=115, y=135 -->
  <rect x="434" y="135" width="42" height="115" rx="4" fill="#238636"/>
  <text x="455" y="130" fill="#3fb950" font-size="10" text-anchor="middle">118</text>
  <text x="455" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Oct</text>

  <!-- Nov: 108 → h=105, y=145 -->
  <rect x="491" y="145" width="42" height="105" rx="4" fill="#238636"/>
  <text x="512" y="140" fill="#3fb950" font-size="10" text-anchor="middle">108</text>
  <text x="512" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Nov</text>

  <!-- Dec: 72 → h=70, y=180 -->
  <rect x="548" y="180" width="42" height="70" rx="4" fill="#196c2e"/>
  <text x="569" y="175" fill="#8b949e" font-size="10" text-anchor="middle">72</text>
  <text x="569" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Dec</text>

  <!-- Jan 2026: 48 → h=47, y=203 -->
  <rect x="605" y="203" width="42" height="47" rx="4" fill="#196c2e"/>
  <text x="626" y="198" fill="#8b949e" font-size="10" text-anchor="middle">48</text>
  <text x="626" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Jan</text>
  <text x="626" y="278" fill="#6e7681" font-size="9"  text-anchor="middle">'26</text>

  <!-- Feb: 38 → h=37, y=213 -->
  <rect x="662" y="213" width="42" height="37" rx="4" fill="#196c2e"/>
  <text x="683" y="208" fill="#8b949e" font-size="10" text-anchor="middle">38</text>
  <text x="683" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Feb</text>

  <!-- Mar 2026: 31 → h=30, y=220 -->
  <rect x="719" y="220" width="42" height="30" rx="4" fill="#196c2e"/>
  <text x="740" y="215" fill="#8b949e" font-size="10" text-anchor="middle">31</text>
  <text x="740" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Mar</text>
  <text x="740" y="278" fill="#6e7681" font-size="9"  text-anchor="middle">'26</text>

  <!-- Legend -->
  <rect x="30"  y="295" width="10" height="10" rx="2" fill="#2ea043"/>
  <text x="44"  y="304" fill="#8b949e" font-size="10">Above avg</text>
  <rect x="120" y="295" width="10" height="10" rx="2" fill="#196c2e"/>
  <text x="134" y="304" fill="#8b949e" font-size="10">Below avg</text>
  <line x1="210" y1="300" x2="240" y2="300" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>
  <text x="244" y="304" fill="#8b949e" font-size="10">Avg ~110/month</text>
</svg>
